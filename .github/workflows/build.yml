name: Build main branch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          YEAR=$(date +%Y)
          WEEK=$(date +%V)
          BASE="${YEAR}.${WEEK}"

          LATEST_TAG=$(git tag -l "${BASE}.*" | sort -V | tail -n 1 || true)

          if [[ -n "${LATEST_TAG}" ]]; then
            PATCH=$(( ${LATEST_TAG##*.} + 1 ))
          else
            PATCH=1
          fi

          VERSION="${BASE}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

  build:
    needs: [prepare]
    strategy:
      matrix:
        kind: ['linux', 'windows']
        include:
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
          - kind: windows
            os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2

      - name: Set Version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: dotnet publish src/CertificateViewer/CertificateViewer.csproj -r ${{ matrix.target }} -c Release -o release/${{ matrix.target }} --nologo -p:PublishSingleFile=true -p:DebugType=None

      - name: Archive Release
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '../../CertificateViewer-${{ matrix.target }}.zip'
          directory: release/${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}.zip
          path: CertificateViewer-${{ matrix.target }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Set Version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> $GITHUB_ENV

      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*.zip"
          commit: ${{ github.sha }}
          tag: ${{ env.VERSION }}
