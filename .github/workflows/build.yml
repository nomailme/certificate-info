name: Build main branch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      NOW: ${{ steps.step1.outputs.NOW }}
    steps:
      - id: step1
        run: echo "NOW=$(date +'%Y-%m-%dT%H%M')" >> "$GITHUB_OUTPUT"
      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_ENV
      - name: Print env
        run: echo ${{ env.NOW }}
  build:
    needs: [prepare]
    strategy:
      matrix:
        kind: ['linux', 'windows']
        include:
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
          - kind: windows
            os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - run: echo "NOW=${{ needs.prepare.outputs.NOW }}" >> $GITHUB_ENV
        env:
          NOW: ${{needs.prepare.outputs.NOW}}  
      - name: Print env
        run: echo ${{ env.NOW }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Publish linux
        env:
          NOW: ${{needs.prepare.outputs.NOW}}  
        run: dotnet publish src/CertificateViewer/CertificateViewer.csproj -r ${{ matrix.target }} -c Release -o release/${{ matrix.target }} --nologo -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ env.NOW }} --self-contained true
      - name: Archive Release
        uses: thedoctor0/zip-release@main
        with:
         type: 'zip'
         filename: '../../CertificateViewer-${{ matrix.target }}.zip'
         directory: release/${{ matrix.target }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}.zip
          path: CertificateViewer-${{ matrix.target }}.zip
  release:
    concurrency: ci-${{ github.ref }}
    needs: [build, prepare] # The second job must depend on the first one to complete before running and uses ubuntu-latest instead of windows.
    runs-on: ubuntu-latest
    steps:
      - run: echo "NOW=${{ needs.prepare.outputs.NOW }}" >> $GITHUB_ENV
        env:
          NOW: ${{needs.prepare.outputs.NOW}}  
      - name: Print env
        run: echo ${{ env.NOW }}
      - name: Print env
        run: echo ${{ env.NOW }}
      - name: Checkout 🛎️
        uses: actions/checkout@v3
      - name: Download Artifacts 
        uses: actions/download-artifact@v4
        with:
         pattern: artifact-*
         path: artifacts
         merge-multiple: true
      - name: Publish win
        run: ls artifacts
      - name: Publish win
        run: ls
      - uses: ncipollo/release-action@v1
        with:
         artifacts: "artifacts/*.zip"
         commit: ${{ github.ref }}
         tag: ${{ env.NOW }}
